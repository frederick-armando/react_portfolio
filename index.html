  <style>
    @font-face {
      font-family: 'Core Sans C Fallback';
      src: local('Segoe UI'), local('Helvetica Neue'), local('Arial'), local('sans-serif');
      font-style: normal;
      font-weight: 400;
      size-adjust: 99.2%;
      ascent-override: 90%;
      descent-override: 22%;
      line-gap-override: 0%;
    }

    @font-face {
      font-family: 'Core Sans C Fallback';
      src: local('Segoe UI'), local('Helvetica Neue'), local('Arial'), local('sans-serif');
      font-style: normal;
      font-weight: 500;
      size-adjust: 99.6%;
      ascent-override: 91%;
      descent-override: 22%;
      line-gap-override: 0%;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-45-regular.woff2') format('woff2');
      font-style: normal;
      font-weight: 400;
      font-display: optional;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-55-medium.woff2') format('woff2');
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-65-bold.woff2') format('woff2');
      font-style: normal;
      font-weight: 600;
      font-display: optional;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-65-bold.woff2') format('woff2');
      font-style: normal;
      font-weight: 700;
      font-display: optional;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-75-extra-bold.woff2') format('woff2');
      font-style: normal;
      font-weight: 800;
      font-display: optional;
    }

    :root {
      --font-family: 'Core Sans C', 'Core Sans C Fallback', 'Segoe UI', sans-serif;
      --color-surface: #ffffff;
      --color-body: #3e4250;
      --color-primary: #385AF9;
      --color-primary-600: #385AF9;
      --color-primary-action: #385AF9;
      --color-primary-action-text: #ffffff;
      --color-focus: #385AF9;
      --color-purple-500: #6f5cff;
      --color-border: #e6e8ef;
      --header-height: 86px;
      --gradient-start: #385AF9;
      --gradient-end: #8728fe;
      --radius-lg: 24px;
      --radius-pill: 999px;
      --motion-standard: cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --color-surface: #14151f;
      --color-body: #b0b3c4;
      --color-primary: #8DA2FF;
      --color-primary-600: #A5B4FF;
      --color-primary-action: #385AF9;
      --color-primary-action-text: #ffffff;
      --color-focus: #A5B4FF;
      --color-purple-500: #8a7aff;
      --color-border: rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 720px) {
      :root {
        --header-height: 76px;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-surface);
      color: var(--color-body);
      font-family: var(--font-family);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--header-height);
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: #fff;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .app-boot-skeleton {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: var(--header-height) 1fr 78px;
      background: var(--color-surface);
    }

    .app-boot-skeleton__bar {
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      display: flex;
      align-items: center;
    }

    .app-boot-skeleton__bar-inner,
    .app-boot-skeleton__nav-inner {
      width: min(100% - 48px, 1120px);
      margin: 0 auto;
      display: flex;
      align-items: center;
    }

    .app-boot-skeleton__bar-inner {
      justify-content: space-between;
      gap: 16px;
    }

    .app-boot-skeleton__brand {
      width: 42px;
      height: 42px;
      border-radius: 14px;
    }

    .app-boot-skeleton__header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-boot-skeleton__header-action {
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .app-boot-skeleton__main {
      display: grid;
      place-items: center;
      padding: 32px 24px;
    }

    .app-boot-skeleton__hero {
      width: min(100%, 760px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .app-boot-skeleton__shape {
      --skeleton-base:
        color-mix(in srgb, var(--color-primary) 7%, var(--color-surface));
      --skeleton-depth:
        color-mix(in srgb, var(--color-purple-500) 6%, var(--color-surface));
      --skeleton-highlight: rgba(255, 255, 255, 0.28);
      --skeleton-border:
        color-mix(in srgb, var(--color-border) 82%, transparent);
      display: block;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background:
        linear-gradient(135deg, var(--skeleton-base), var(--skeleton-depth));
      border: 1px solid var(--skeleton-border);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 14px 40px rgba(56, 90, 249, 0.035);
      isolation: isolate;
      opacity: 0.92;
      pointer-events: none;
      transform: translateZ(0);
      user-select: none;
    }

    .app-boot-skeleton__shape::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      background: linear-gradient(105deg, transparent 0 35%, var(--skeleton-highlight) 48%, transparent 62%);
      transform: translateX(-120%);
      will-change: transform;
      animation: app-boot-skeleton-shimmer 2.8s var(--motion-standard) infinite;
    }

    [data-theme="dark"] .app-boot-skeleton__shape {
      --skeleton-base:
        color-mix(in srgb, var(--color-primary) 13%, #191b27);
      --skeleton-depth:
        color-mix(in srgb, var(--color-purple-500) 10%, #11131d);
      --skeleton-highlight: rgba(255, 255, 255, 0.075);
      --skeleton-border: rgba(255, 255, 255, 0.065);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 18px 48px rgba(0, 0, 0, 0.18);
    }

    .app-boot-skeleton__avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
    }

    .app-boot-skeleton__header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      max-width: 100%;
    }

    .app-boot-skeleton__line {
      width: min(560px, 86vw);
      height: 16px;
      border-radius: var(--radius-pill);
    }

    .app-boot-skeleton__lead {
      width: min(620px, 86vw);
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .app-boot-skeleton__chip-rail {
      width: min(360px, 72vw);
      height: 32px;
      border-radius: var(--radius-pill);
    }

    .app-boot-skeleton__actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .app-boot-skeleton__button {
      width: 180px;
      height: 48px;
      border-radius: var(--radius-pill);
    }

    @media (max-width: 720px) {
      .app-boot-skeleton__hero {
        gap: 16px;
      }

      .app-boot-skeleton__header {
        gap: 8px;
      }

      .app-boot-skeleton__actions {
        width: 100%;
        flex-direction: column-reverse;
        align-items: stretch;
      }

      .app-boot-skeleton__button {
        width: 100%;
      }

      .app-boot-skeleton__bar-inner,
      .app-boot-skeleton__nav-inner {
        width: min(100% - 32px, 1120px);
      }

      .app-boot-skeleton__header-actions {
        gap: 8px;
      }

      .app-boot-skeleton__header-action {
        width: 44px;
        height: 44px;
      }
    }

    .app-boot-skeleton__nav {
      border-top: 1px solid rgba(127, 136, 160, 0.18);
      background: var(--color-surface);
      display: flex;
      align-items: center;
    }

    .app-boot-skeleton__nav-inner {
      justify-content: space-between;
      gap: 16px;
    }

    .app-boot-skeleton__nav-item {
      min-width: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .app-boot-skeleton__nav-icon {
      width: 44px;
      height: 32px;
      border-radius: var(--radius-pill);
    }

    .app-boot-skeleton__nav-label {
      width: 34px;
      height: 8px;
      border-radius: var(--radius-pill);
    }

    @media (max-width: 720px) {
      .app-boot-skeleton__nav-inner {
        gap: 8px;
      }

      .app-boot-skeleton__nav-item {
        min-width: 48px;
      }

      .app-boot-skeleton__nav-icon {
        width: 40px;
      }

      .app-boot-skeleton__nav-label {
        width: 28px;
      }
    }

    @keyframes app-boot-skeleton-shimmer {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(120%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-boot-skeleton__shape::after {
        animation: none;
        opacity: 0;
      }
    }
  </style>
  <script>
    // FOUC prevention & CSS Deferral
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('themePreference'); } catch (e) { }
      var theme = stored === 'dark' || stored === 'light' ? stored
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#14151f' : '#385AF9');
    })();
  </script>
  <script>
    // Detect webp/avif support early for conditional font loading
    document.documentElement.className += ' js';
  </script>
