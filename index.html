  <title>Frederick Armando | Lead Product Designer</title>
  <style>
    @font-face {
      font-family: 'Core Sans C Fallback';
      src: local('Segoe UI'), local('Helvetica Neue'), local('Arial'), local('sans-serif');
      font-style: normal;
      font-weight: 400;
      size-adjust: 99.2%;
      ascent-override: 90%;
      descent-override: 22%;
      line-gap-override: 0%;
    }

    @font-face {
      font-family: 'Core Sans C Fallback';
      src: local('Segoe UI'), local('Helvetica Neue'), local('Arial'), local('sans-serif');
      font-style: normal;
      font-weight: 500;
      size-adjust: 99.6%;
      ascent-override: 91%;
      descent-override: 22%;
      line-gap-override: 0%;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-45-regular.woff2') format('woff2');
      font-style: normal;
      font-weight: 400;
      font-display: optional;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-55-medium.woff2') format('woff2');
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-65-bold.woff2') format('woff2');
      font-style: normal;
      font-weight: 600;
      font-display: optional;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-65-bold.woff2') format('woff2');
      font-style: normal;
      font-weight: 700;
      font-display: optional;
    }

    @font-face {
      font-family: 'Core Sans C';
      src: url('/fonts/core-sans/core-sans-c-75-extra-bold.woff2') format('woff2');
      font-style: normal;
      font-weight: 800;
      font-display: optional;
    }

    :root {
      --font-family: 'Core Sans C', 'Core Sans C Fallback', 'Segoe UI', sans-serif;
      --color-surface: #ffffff;
      --color-body: #3e4250;
      --color-primary: #385AF9;
      --color-primary-600: #385AF9;
      --color-primary-action: #385AF9;
      --color-primary-action-text: #ffffff;
      --color-focus: #385AF9;
      --header-height: 86px;
      --gradient-start: #385AF9;
      --gradient-end: #8728fe;
    }

    [data-theme="dark"] {
      --color-surface: #14151f;
      --color-body: #b0b3c4;
      --color-primary: #8DA2FF;
      --color-primary-600: #A5B4FF;
      --color-primary-action: #385AF9;
      --color-primary-action-text: #ffffff;
      --color-focus: #A5B4FF;
    }

    @media (max-width: 720px) {
      :root {
        --header-height: 76px;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-surface);
      color: var(--color-body);
      font-family: var(--font-family);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--header-height);
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: #fff;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .app-boot-skeleton {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: var(--header-height) 1fr 78px;
      background: var(--color-surface);
    }

    .app-boot-skeleton__bar {
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    }

    .app-boot-skeleton__main {
      display: grid;
      place-items: center;
      padding: 32px 24px;
    }

    .app-boot-skeleton__hero {
      width: min(100%, 760px);
      display: grid;
      justify-items: center;
      gap: 20px;
    }

    .app-boot-skeleton__shape {
      display: block;
      border-radius: 999px;
      background: color-mix(in srgb, var(--color-primary) 10%, var(--color-surface));
    }

    .app-boot-skeleton__avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
    }

    .app-boot-skeleton__title {
      width: min(420px, 78vw);
      height: 54px;
    }

    .app-boot-skeleton__line {
      width: min(560px, 86vw);
      height: 18px;
    }

    .app-boot-skeleton__actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .app-boot-skeleton__button {
      width: 180px;
      height: 48px;
    }

    .app-boot-skeleton__nav {
      border-top: 1px solid rgba(127, 136, 160, 0.18);
      background: var(--color-surface);
    }
  </style>
  <script>
    // FOUC prevention & CSS Deferral
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('themePreference'); } catch (e) { }
      var theme = stored === 'dark' || stored === 'light' ? stored
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#14151f' : '#385AF9');
    })();
  </script>
  <script>
    // Detect webp/avif support early for conditional font loading
    document.documentElement.className += ' js';
  </script>
  <noscript><style>.js-only{display:none!important}</style></noscript>
</head>

<body>
  <div id="root">
    <div class="app-boot-skeleton" aria-hidden="true">
      <div class="app-boot-skeleton__bar"></div>
      <div class="app-boot-skeleton__main">
        <div class="app-boot-skeleton__hero">
          <span class="app-boot-skeleton__shape app-boot-skeleton__avatar"></span>
          <span class="app-boot-skeleton__shape app-boot-skeleton__title"></span>
          <span class="app-boot-skeleton__shape app-boot-skeleton__line"></span>
          <div class="app-boot-skeleton__actions">
            <span class="app-boot-skeleton__shape app-boot-skeleton__button"></span>
            <span class="app-boot-skeleton__shape app-boot-skeleton__button"></span>
          </div>
        </div>
      </div>
      <div class="app-boot-skeleton__nav"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
