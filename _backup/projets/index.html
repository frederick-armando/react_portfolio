    body {

      position: fixed;
      top: 0;

      grid-template-rows: var(--header-height) 1fr 78px;

      display: flex;
      align-items: center;
    }

      margin: 0 auto;

      width: 42px;
      height: 42px;
      border-radius: 14px;
    }

    .app-boot-skeleton__header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .app-boot-skeleton__main {
      display: grid;
      place-items: center;
      padding: 32px 24px;
    }

    .app-boot-skeleton__hero {
      width: min(100%, 760px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;

      --skeleton-base:
        color-mix(in srgb, var(--color-primary) 7%, var(--color-surface));
      --skeleton-depth:
        color-mix(in srgb, var(--color-purple-500) 6%, var(--color-surface));
      --skeleton-highlight: rgba(255, 255, 255, 0.28);
      --skeleton-border:
        color-mix(in srgb, var(--color-border) 82%, transparent);
      display: block;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background:
        linear-gradient(105deg, transparent 0 38%, var(--skeleton-highlight) 48%, transparent 60%),
        linear-gradient(135deg, var(--skeleton-base), var(--skeleton-depth));
      background-size: 260% 100%, 100% 100%;
      border: 1px solid var(--skeleton-border);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),

      opacity: 0.92;
      pointer-events: none;
      user-select: none;
      animation: app-boot-skeleton-shimmer 2.8s var(--motion-standard) infinite;

      --skeleton-highlight: rgba(255, 255, 255, 0.075);
      --skeleton-border: rgba(255, 255, 255, 0.065);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),

      height: 88px;
      border-radius: 50%;
    }

      justify-content: center;
      gap: 20px;
      max-width: 100%;
    }

    .app-boot-skeleton__line {

      height: 16px;
      border-radius: var(--radius-pill);
    }

    .app-boot-skeleton__lead {
      width: min(620px, 86vw);
      display: grid;
      gap: 12px;
      justify-items: center;
    }

      height: 32px;
      border-radius: var(--radius-pill);
    }

      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

      width: 180px;
      height: 48px;
      border-radius: var(--radius-pill);

        gap: 8px;

        width: 44px;

      }

      align-items: center;
    }

      justify-content: space-between;
      gap: 16px;
    }

    .app-boot-skeleton__nav-item {
      min-width: 56px;

    .app-boot-skeleton__nav-label {
      width: 34px;
      height: 8px;
      border-radius: var(--radius-pill);
    }

    @media (max-width: 720px) {
      .app-boot-skeleton__nav-inner {
        gap: 8px;
      }

        width: 40px;
      }

      .app-boot-skeleton__nav-label {
        width: 28px;
      }

    @keyframes app-boot-skeleton-shimmer {
      0% {
        background-position: 155% 0, 0 0;

        background-position: -155% 0, 0 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-boot-skeleton__shape {
        animation: none;
        background-position: 0 0, 0 0;
      }
